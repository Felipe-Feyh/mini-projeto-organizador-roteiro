name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check src/ tests/ --output-format=json > lint-results.json || true

      - name: Show lint results
        run: |
          echo "=== LINT RESULTS ==="
          ruff check src/ tests/ || true
          echo "=== END LINT ==="

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: lint-results.json

  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=json 2>&1 | tee test-output.log
        env:
          APP_ENV: testing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-output.log
            coverage.json

  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t organizador-roteiros:latest . 2>&1 | tee build-output.log

      - name: Test Docker health check
        run: |
          docker run -d --name test-app -p 8000:8000 organizador-roteiros:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-app
          docker rm test-app

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results
          path: build-output.log
